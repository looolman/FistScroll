name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Download models
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          curl -fL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
          ls -l app/src/main/assets

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FistScroll.apk
          gh release create "v${{ github.run_number }}" FistScroll.apk \
            --target "${{ github.sha }}" \
            --title "FistScroll build ${{ github.run_number }}" \
            --notes "Готовый APK. Скачай FistScroll.apk и установи." \
            --latest

      - name: Publish log on failure
        if: failure()
        run: |
          [ -f build.log ] || echo "Сборка упала до запуска Gradle (см. шаг Download models)" > build.log
          tail -n 400 build.log > /tmp/log.txt
          git config user.name "build-bot"
          git config user.email "noreply@example.com"
          git checkout --orphan buildlog
          git rm -rf . -q
          cp /tmp/log.txt build.log
          git add -f build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin buildlog

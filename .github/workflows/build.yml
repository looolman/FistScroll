name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Download hand model
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          ls -l app/src/main/assets

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FistScroll.apk
          gh release create "v${{ github.run_number }}" FistScroll.apk \
            --target "${{ github.sha }}" \
            --title "FistScroll build ${{ github.run_number }}" \
            --notes "Готовый APK. Скачай FistScroll.apk и установи." \
            --latest

      - name: Publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "Сборка упала до запуска Gradle (см. шаг Download hand model)" > build.log
          gh release create "failed-${{ github.run_number }}" build.log \
            --target "${{ github.sha }}" \
            --title "FAILED build ${{ github.run_number }}" \
            --notes "Лог ошибки сборки" \
            --prerelease
